<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Складская система - Вход</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #475569;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .login-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

            .logo h1 {
                font-size: 28px;
                font-weight: 700;
                background: linear-gradient(135deg, var(--accent), #8b5cf6);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                margin-bottom: 8px;
            }

            .logo p {
                color: var(--text-secondary);
                font-size: 14px;
            }

        .form-group {
            margin-bottom: 24px;
        }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                font-weight: 500;
                color: var(--text-primary);
            }

            .form-group input {
                width: 100%;
                padding: 14px 16px;
                background: var(--bg-card);
                border: 2px solid var(--border);
                border-radius: 10px;
                color: var(--text-primary);
                font-size: 15px;
                transition: all 0.3s;
            }

                .form-group input:focus {
                    outline: none;
                    border-color: var(--accent);
                    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
                }

        .btn {
            width: 100%;
            padding: 14px 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

            .btn:hover {
                background: var(--accent-hover);
                transform: translateY(-2px);
            }

            .btn:active {
                transform: translateY(0);
            }

            .btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none;
            }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-message {
            color: var(--danger);
            font-size: 14px;
            margin-top: 8px;
            display: none;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 6px;
            text-align: center;
        }

        .version {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-secondary);
        }

            .register-link a {
                color: var(--accent);
                text-decoration: none;
                font-weight: 500;
            }

                .register-link a:hover {
                    text-decoration: underline;
                }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }

            .logo h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="logo">
                <h1>📦 Складская система</h1>
                <p>Управление товарами и запасами</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text"
                           id="username"
                           placeholder="Введите ваш логин"
                           required
                           autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password"
                           id="password"
                           placeholder="Введите пароль"
                           required
                           autocomplete="current-password">
                </div>

                <div class="error-message" id="errorMessage">
                    Неверный логин или пароль
                </div>

                <button type="submit" class="btn" id="loginBtn" disabled>
                    Войти в систему
                </button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px;">Авторизация...</p>
            </div>

            <div class="register-link">
                Нет аккаунта? <a href="/regClientPage">Зарегистрироваться</a>
            </div>

            <div class="version">
                Версия 1.0.0 • Система управления
            </div>
        </div>
    </div>

    <script>
        let isSubmitting = false;

        function validateForm() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            const isValid = username.length > 0 && password.length > 0;
            loginBtn.disabled = !isValid || isSubmitting;

            return isValid;
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.style.display = 'block';

            setTimeout(() => {
                errorElement.style.display = 'none';
            }, 5000);
        }

        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }

        function showLoading() {
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
        }

        function hideLoading() {
            document.getElementById('loginBtn').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }

        function redirectToUserPage(username) {
            if (username === 'admin') {
                window.location.href = '/adminPage';
            } else if (username === 'merchandiser') {
                window.location.href = '/sallerPage';
            } else {
                window.location.href = '/clientPage';
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');

            usernameInput.addEventListener('input', validateForm);
            passwordInput.addEventListener('input', validateForm);

            loginForm.addEventListener('submit', async function (e) {
                e.preventDefault();

                if (isSubmitting) return;

                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username || !password) {
                    showError('Заполните все поля');
                    return;
                }

                isSubmitting = true;
                hideError();
                showLoading();

                try {
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            username: username,
                            password: password
                        }),
                        credentials: 'include'
                    });

                    if (response.ok) {
                        setTimeout(() => {
                            redirectToUserPage(username);
                        }, 500);
                    } else {
                        const errorText = await response.text();
                        hideLoading();
                        isSubmitting = false;
                        showError(errorText || 'Ошибка при входе');

                        loginForm.classList.add('error');
                        setTimeout(() => loginForm.classList.remove('error'), 500);
                        validateForm();
                    }
                } catch (error) {
                    hideLoading();
                    isSubmitting = false;
                    showError('Ошибка соединения с сервером');
                    validateForm();
                }
            });

            validateForm();
        });
    </script>
</body>
</html>
